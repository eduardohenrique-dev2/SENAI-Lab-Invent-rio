name: Quality Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)

      - name: Security and dependency policy
        shell: bash
        run: node .github/quality-check.mjs

      - name: HTML lint
        continue-on-error: true
        run: npx --yes htmlhint "**/*.html"

  smoke:
    name: Smoke browser
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0 @axe-core/playwright@4.13.0
          npx playwright install --with-deps chromium

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/smoke-http.log 2>&1 &
          echo $! > /tmp/smoke-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/smoke-http.log
          exit 1

      - name: Run Playwright smoke tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test .github/smoke/smoke.spec.mjs --reporter=line --workers=1
